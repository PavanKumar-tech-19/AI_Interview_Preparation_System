<!DOCTYPE html>
<html>

<head>

    <title>Register - AI Interview Preparation System</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
        }

        .container{

            width:400px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;

        }

        h1{
            color:#333;
        }

        input{

            width:90%;
            padding:10px;
            margin:10px 0;
            font-size:16px;

        }

        button{

            width:95%;
            padding:10px;
            font-size:16px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;

        }

        button:hover{

            background:#218838;

        }

        .error{

            color:red;
            margin-bottom:10px;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">
Register
</button>

</form>

<br>

<a href="/login">
Already have an account? Login
</a>

</div>

</body>

</html>
